[project]
name = "deep-research-system"
version = "0.1.0"
description = "Multi-agent deep research system with FastAPI + LangGraph"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "annotated-types>=0.7.0",
    "anyio>=4.13.0",
    "certifi>=2026.5.20",
    "charset-normalizer>=3.4.7",
    "click>=8.4.1",
    "distro>=1.9.0",
    "fastapi>=0.136.3",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "idna>=3.16",
    "iniconfig>=2.3.0",
    "jinja2>=3.1.6",
    "jiter>=0.15.0",
    "jsonpatch>=1.33",
    "jsonpointer>=3.1.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-protocol>=0.0.15",
    "langgraph>=1.2.1",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.5",
    "loguru>=0.7.3",
    "markupsafe>=3.0.3",
    "openai>=2.38.0",
    "orjson>=3.11.9",
    "ormsgpack>=1.12.2",
    "packaging>=26.2",
    "pluggy>=1.6.0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.14.1",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "redis>=7.4.0",
    "regex>=2026.5.9",
    "requests>=2.34.2",
    "requests-toolbelt>=1.0.0",
    "sniffio>=1.3.1",
    "starlette>=1.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "tqdm>=4.67.3",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
    "urllib3>=2.7.0",
    "uvicorn>=0.47.0",
    "xxhash>=3.7.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "C901",   # too complex
    "SIM102", # use dict.get for default value (nested if statement)
    "SIM108", # use ternary (not always clearer)
]

[tool.ruff.lint.isort]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "httpx.*", "orjson.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
